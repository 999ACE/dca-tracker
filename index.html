<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="iPlouton">
<title>iPlouton</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* iOS-style design: grouped lists on a grey ground, one blue accent, system font, bottom tab bar. */
:root {
  --bg: #f2f2f7; --surface: #ffffff; --ink: #000000; --muted: #6c6c70; --line: #e0e0e6; --fill: #f2f2f7;
  --blue: #007aff; --tint: #e5f1ff; --accent: #007aff; --accent-ink: #ffffff;
  --go: #1f7a38; --go-bg: #e3f6e8; --slow: #a45a00; --slow-bg: #fff0d6; --warn: #d70015; --warn-bg: #ffe5e8; --norm-bg: #ececf1;
  --core: #007aff; --quality: #af52de; --spec: #ff9500;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1c1c1e; --ink: #ffffff; --muted: #98989f; --line: #38383a; --fill: #2c2c2e;
    --blue: #0a84ff; --tint: #10294a; --accent: #0a84ff; --accent-ink: #ffffff;
    --go: #30d158; --go-bg: #12301b; --slow: #ff9f0a; --slow-bg: #3a2a08; --warn: #ff6961; --warn-bg: #3d1a1c; --norm-bg: #2c2c2e;
    --core: #0a84ff; --quality: #bf5af2; --spec: #ff9f0a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --ink: #ffffff; --muted: #98989f; --line: #38383a; --fill: #2c2c2e;
  --blue: #0a84ff; --tint: #10294a; --accent: #0a84ff; --accent-ink: #ffffff;
  --go: #30d158; --go-bg: #12301b; --slow: #ff9f0a; --slow-bg: #3a2a08; --warn: #ff6961; --warn-bg: #3d1a1c; --norm-bg: #2c2c2e;
  --core: #0a84ff; --quality: #bf5af2; --spec: #ff9f0a;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-block: 12px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 34px; font-weight: 700; line-height: 1.1; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.apphead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 6px 0 14px; }
.apphead .eyebrow { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--tint); color: var(--blue); font: 700 18px var(--font-display); cursor: pointer; flex: 0 0 auto; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [data-open]:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* tab bar */
nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabbar .in { max-width: 640px; margin: 0 auto; display: flex; }
nav.tabbar button { flex: 1; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font: 600 10.5px var(--font-body); padding: 4px 0; cursor: pointer; }
nav.tabbar button[aria-selected="true"] { color: var(--blue); }

/* lists */
.sechead { display: flex; align-items: center; gap: 10px; margin: 6px 4px 8px; }
.sechead > div:first-of-type { min-width: 0; flex: 1; }
.badge { width: 26px; height: 26px; border-radius: 50%; background: var(--blue); color: #fff; font: 700 13px var(--font-display); display: grid; place-items: center; flex: 0 0 auto; }
.grouphead { font-size: 13px; color: var(--muted); margin: 14px 8px 6px; text-transform: uppercase; letter-spacing: .03em; font-weight: 600; }
.list { background: var(--surface); border-radius: 12px; overflow: hidden; }
.li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); width: 100%; font: inherit; color: inherit; text-align: left; }
.list > .li:first-child { border-top: 0; }
.li > span:first-child { flex: 1 1 auto; min-width: 0; }
.li .val i { font-style: normal; white-space: nowrap; }
.li .val { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; color: var(--muted); min-width: 0; }
.li .val input { border: 0; background: transparent; text-align: right; width: 96px; padding: 2px 0; font-size: 16px; color: var(--ink); border-radius: 0; font-variant-numeric: tabular-nums; }
.li .val select { border: 0; background: transparent; color: var(--ink); width: auto; font-size: 16px; text-align: right; padding: 2px 0; }
.li.add { color: var(--blue); font-weight: 600; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; cursor: pointer; }
.foot { font-size: 13px; color: var(--muted); margin: 6px 8px 0; }
.hrow { cursor: pointer; align-items: flex-start; }
.hmain { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.hl1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hl2 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pin { display: inline-flex; align-items: center; gap: 2px; background: var(--fill); border-radius: 8px; padding: 2px 8px; color: var(--muted); }
.pin input { border: 0; background: transparent; width: 88px; font-size: 16px; padding: 3px 0; color: var(--ink); font-variant-numeric: tabular-nums; }
.hbuy { text-align: right; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
.hbuy b { font-size: 18px; display: block; }
.chev { color: var(--muted); font-size: 22px; line-height: 1; }

/* hero */
.hero { background: linear-gradient(145deg, #0a5fd0, #4a3fc4); color: #fff; border-radius: 20px; padding: 20px; }
.hero .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .9; }
.hero .big { font: 700 40px/1.1 var(--font-display); margin: 6px 0; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.hero .sub { font-size: 15px; opacity: .95; }
.hero .hnote { background: rgba(255,255,255,.18); border-radius: 10px; padding: 8px 12px; font-size: 14px; margin-top: 10px; }
.hero .hbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.hero .hfoot { font-size: 13px; opacity: .9; margin-top: 12px; }
.btn.onhero { background: #fff; color: #0a4fb0; border-color: #fff; }
.btn.ghost { background: rgba(255,255,255,.2); color: #fff; border-color: transparent; }

/* cards and controls */
.panel { background: var(--surface); border-radius: 16px; padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
input, select, textarea { font: 16px var(--font-body); color: var(--ink); background: var(--fill); border: 0; border-radius: 10px; padding: 9px 11px; width: 100%; min-width: 0; }
input[type=number] { font-variant-numeric: tabular-nums; }
.btn { font: 600 15px var(--font-body); border: 0; background: var(--tint); color: var(--blue); padding: 9px 16px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--blue); color: #fff; }
.btn.danger { background: var(--warn-bg); color: var(--warn); }
.btn.block { width: 100%; margin-top: 14px; padding: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
a { color: var(--blue); }
.tile { background: var(--fill); border-radius: 12px; padding: 12px; }
.tile .k { font-size: 13px; color: var(--muted); }
.tile .v { font: 700 22px var(--font-display); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.r, th.r { text-align: right; }
tr:last-child td { border-bottom: 0; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill.double { background: var(--go-bg); color: var(--go); }
.pill.half { background: var(--slow-bg); color: var(--slow); }
.pill.normal { background: var(--norm-bg); color: var(--ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.note { border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.info { background: var(--tint); color: var(--ink); }
.bar { height: 10px; background: var(--norm-bg); border-radius: 5px; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; }
.tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; }
.halfbox { border: 2px solid var(--slow); border-radius: 12px; padding: 9px 14px; font-size: 14px; }
.halfbox b { color: var(--slow); }
textarea { min-height: 120px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
svg .gl { stroke: var(--line); stroke-width: 1; }
svg#pfchart { overflow: visible; }
svg .ax { fill: var(--muted); font-size: 17px; font-family: var(--font-body); }
svg .lb { fill: var(--ink); font-size: 18px; font-family: var(--font-body); }
.tip { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 12px; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
code { font-family: ui-monospace, Menlo, Consolas, monospace; background: var(--fill); padding: 1px 5px; border-radius: 4px; }
details summary { cursor: pointer; color: var(--blue); }

/* sheet */
.sheetwrap { position: fixed; inset: 0; z-index: 50; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; width: 100%; max-width: 640px; max-height: 90%; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.shead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.link { background: none; border: 0; color: var(--blue); font: 600 16px var(--font-body); cursor: pointer; padding: 6px 0; }
.how p { margin: 4px 0 12px; font-size: 15px; }
@media (max-width: 480px) { #saveState { display: none; } }
@media (max-width: 420px) { h1 { font-size: 30px; } .hero .big { font-size: 34px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="apphead">
    <div>
      <div class="eyebrow" id="eyebrow">Monthly investing, by the rules</div>
      <h1 id="title">iPlouton</h1>
    </div>
    <div style="display:flex;align-items:center;gap:10px"><span class="small muted" id="saveState"></span><button class="iconbtn" data-act="howto" aria-label="How iPlouton works">i</button></div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<nav class="tabbar" id="tabs" role="tablist" aria-label="Sections"></nav>
<div class="sheetwrap" id="sheet" hidden></div>

<script>
(function () {
  "use strict";
  var KEY = "three-speeds-dca-v1";
  var LAYERS = [
    { id: "core", name: "Core", sub: "Index fund or ETF, the offensive line", color: "var(--core)" },
    { id: "quality", name: "Quality growth", sub: "Real revenue, real scale", color: "var(--quality)" },
    { id: "spec", name: "Speculative", sub: "High potential, high volatility", color: "var(--spec)" }
  ];
  var TRIM = [10, 20, 30];

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function num(v) { if (v === "" || v == null) return null; var n = parseFloat(v); return isFinite(n) ? n : null; }
  function today() { return new Date().toISOString().slice(0, 10); }

  function example() {
    function H(layer, name, ticker, shares, cost, price, high, rung) {
      return { id: uid(), layer: layer, name: name, ticker: ticker, w: 1, shares: shares, cost: cost, price: price, high: high, p30: null, rung: rung || 0 };
    }
    return {
      example: true,
      cur: "$", monthly: 1000, dry: 2000, investDay: 1, pricesAsOf: "2026-11-13",
      alloc: { core: 45, quality: 50, spec: 5 },
      specCap: 5, halfPct: 20,
      trig: { core: 10, quality: 20, spec: 20 },
      holdings: [
        H("core", "S&P 500 index", "SPX", 2, 6800, 7562, 7819),
        H("quality", "NVIDIA", "NVDA", 40, 120, 162.85, 239.24),
        H("quality", "Google", "GOOGL", 20, 210, 295.77, 408.61),
        H("quality", "Tesla", "TSLA", 12, 150, 390.22, 498.83, 2),
        H("quality", "Palantir", "PLTR", 25, 140, 169.2, 212.94),
        H("spec", "SpaceX", "SPCX", 10, 150, 143.09, 225.64),
        H("spec", "Bloom Energy", "BE", 15, 200, 185.42, 351.28)
      ],
      history: [],
      snaps: [
        { date: "2026-08-14", value: 30100, cost: 28000, dry: 1500 },
        { date: "2026-09-14", value: 33800, cost: 29600, dry: 1750 },
        { date: "2026-10-14", value: 37900, cost: 31000, dry: 1900 },
        { date: "2026-11-13", value: 40678.24, cost: 32400, dry: 2000 }
      ]
    };
  }
  function blank() {
    return { example: false, cur: "£", monthly: 500, dry: 0, investDay: 1, pricesAsOf: null, alloc: { core: 50, quality: 45, spec: 5 }, specCap: 5, halfPct: 20, trig: { core: 10, quality: 20, spec: 20 }, holdings: [], history: [], snaps: [] };
  }

  var S, storageOK = true;
  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) { storageOK = false; }
    return null;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); document.getElementById("saveState").textContent = "Saved on this device"; }
    catch (e) { storageOK = false; document.getElementById("saveState").textContent = "Not saved: browser storage unavailable. Use Settings > Backup."; }
  }
  S = load() || example();
  if (!Array.isArray(S.snaps)) S.snaps = [];
  S.investDay = Math.min(31, Math.max(1, parseInt(S.investDay, 10) || 1));

  function money(n) {
    if (n == null || !isFinite(n)) return "–";
    var neg = n < 0;
    return (neg ? "-" : "") + S.cur + Math.abs(n).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function pct(n, d) { if (n == null || !isFinite(n)) return "–"; return n.toLocaleString("en-GB", { minimumFractionDigits: d == null ? 1 : d, maximumFractionDigits: d == null ? 1 : d }) + "%"; }

  /* ---------- Calculations ---------- */
  function totals() {
    var byLayer = { core: 0, quality: 0, spec: 0 }, all = 0;
    S.holdings.forEach(function (h) {
      var v = (h.shares || 0) * (h.price || 0);
      byLayer[h.layer] += v; all += v;
    });
    return { byLayer: byLayer, all: all };
  }

  function computePlan() {
    var T = totals();
    var rows = [], unallocated = 0, notes = [];
    LAYERS.forEach(function (L) {
      var hs = S.holdings.filter(function (h) { return h.layer === L.id; });
      var budget = S.monthly * (S.alloc[L.id] || 0) / 100;
      var sumW = hs.reduce(function (a, h) { return a + (h.w > 0 ? h.w : 1); }, 0);
      if (!hs.length) { unallocated += budget; if (budget > 0) notes.push("No holdings in " + L.name + ", so its " + money(budget) + " goes to dry powder."); return; }
      hs.forEach(function (h) {
        var base = budget * (h.w > 0 ? h.w : 1) / sumW;
        var off = (h.high > 0 && h.price > 0) ? (1 - h.price / h.high) * 100 : null;
        var up = (h.p30 > 0 && h.price > 0) ? (h.price / h.p30 - 1) * 100 : null;
        var trig = S.trig[L.id];
        var isDown = off != null && off >= trig;
        var isUp = up != null && up >= S.halfPct;
        var speed = isDown ? "double" : isUp ? "half" : "normal";
        var mult = speed === "double" ? 1.5 : speed === "half" ? 0.25 : 0.5;
        rows.push({ h: h, layer: L.id, base: base, off: off, up: up, trig: trig, speed: speed, mult: mult, amt: base * mult, both: isDown && isUp, capped: false });
      });
    });

    // Speculative sleeve cap
    var cap = S.specCap / 100;
    if (cap > 0 && cap < 1) {
      var other = rows.filter(function (r) { return r.layer !== "spec"; }).reduce(function (a, r) { return a + r.amt; }, 0);
      var specRows = rows.filter(function (r) { return r.layer === "spec"; });
      var specAmt = specRows.reduce(function (a, r) { return a + r.amt; }, 0);
      var maxSpec = Math.max(0, (cap * (T.all + other) - T.byLayer.spec) / (1 - cap));
      if (specAmt > maxSpec + 0.005) {
        var f = specAmt > 0 ? maxSpec / specAmt : 0;
        specRows.forEach(function (r) { r.amt *= f; r.capped = true; });
        notes.push("Speculative buys limited to " + money(maxSpec) + " to keep the sleeve at or under " + S.specCap + "% of your portfolio.");
      }
    }

    // Dry powder limit
    var total = rows.reduce(function (a, r) { return a + r.amt; }, 0);
    var avail = S.monthly + Math.max(0, S.dry);
    var scaled = false;
    if (total > avail + 0.005) {
      var g = avail / total;
      rows.forEach(function (r) { r.amt *= g; r.scaled = true; });
      total = avail; scaled = true;
      notes.push("Dry powder cannot fund every double-down. All buys were scaled down to " + money(avail) + ".");
    }
    rows.forEach(function (r) { r.units = r.h.price > 0 ? r.amt / r.h.price : null; });
    var dryChange = S.monthly - total;

    // Trim ladder
    var trims = [];
    S.holdings.forEach(function (h) {
      if (!(h.shares > 0 && h.cost > 0 && h.price > 0)) return;
      var gain = (h.price / h.cost - 1) * 100;
      var next = (h.rung || 0) + 1;
      if (gain >= 50 * next) {
        var p = TRIM[(next - 1) % 3];
        var more = 0, k = next + 1;
        while (gain >= 50 * k) { more++; k++; }
        trims.push({ h: h, gain: gain, rung: next, pct: p, shares: h.shares * p / 100, proceeds: h.shares * p / 100 * h.price, more: more });
      }
    });

    // Sleeve check
    var sleeveNow = T.all > 0 ? T.byLayer.spec / T.all * 100 : 0;
    var postVal = T.all + total;
    var sleeveAfter = postVal > 0 ? (T.byLayer.spec + rows.filter(function (r) { return r.layer === "spec"; }).reduce(function (a, r) { return a + r.amt; }, 0)) / postVal * 100 : 0;

    return { rows: rows, total: total, dryChange: dryChange, notes: notes, trims: trims, T: T, sleeveNow: sleeveNow, sleeveAfter: sleeveAfter, unallocated: unallocated, scaled: scaled };
  }

  /* ---------- Actions ---------- */
  function snap() {
    var T = totals(), cost = 0, d = ymd(new Date());
    S.holdings.forEach(function (h) { if (h.shares > 0 && h.cost > 0) cost += h.shares * h.cost; });
    S.snaps = (S.snaps || []).filter(function (x) { return x.date !== d; });
    S.snaps.push({ date: d, value: T.all, cost: cost, dry: S.dry || 0 });
    S.snaps.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  }
  function recordMonth() {
    var P = computePlan(), lines = [];
    P.rows.forEach(function (r) {
      if (!(r.amt > 0) || !(r.h.price > 0)) return;
      var h = r.h, u = r.amt / h.price, old = (h.shares || 0) * (h.cost || h.price);
      h.shares = (h.shares || 0) + u;
      h.cost = (old + r.amt) / h.shares;
      lines.push({ t: h.ticker || h.name, amt: r.amt, speed: r.speed, price: h.price, units: u });
    });
    S.dry = Math.max(0, (S.dry || 0) + P.dryChange);
    snap();
    S.history.unshift({ id: uid(), date: today(), kind: "buy", monthly: S.monthly, invested: P.total, dryChange: P.dryChange, dryAfter: S.dry, lines: lines });
    save();
  }
  function recordTrim(id) {
    var P = computePlan(), t = P.trims.filter(function (x) { return x.h.id === id; })[0];
    if (!t) return;
    t.h.shares -= t.shares;

      }).join("") + "</div>" : '<div class="list"><div class="li muted small">Nothing to trim right now. Trims happen at +50%, +100% and +150% on your average cost (10%, 20%, 30%), then the cycle repeats at +200%, +250% and +300%.</div></div>') + "</section>";

  function chartHtml() {
    var pts = (S.snaps || []).slice();
    var head = '<section class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h2>Value over time</h2><button class="btn" data-act="snap">Save snapshot now</button></div>';
    if (pts.length < 2) return head + '<p class="muted" style="margin-top:8px">A snapshot is saved each time you Refresh prices or record a purchase or trim. The chart appears once there are two or more.</p></section>';
    var W = 640, H = 250, ml = 56, mr = 70, mt = 14, mb = 28;
    var t0 = new Date(pts[0].date).getTime(), t1 = new Date(pts[pts.length - 1].date).getTime();
    var vals = []; pts.forEach(function (p) { vals.push(p.value, p.cost); });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var step = Math.pow(10, Math.floor(Math.log(Math.max(hi - lo, 1)) / Math.LN10)) / 2;
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; if (hi === lo) hi = lo + step;
    function X(d) { return ml + (t1 === t0 ? 0 : (new Date(d).getTime() - t0) / (t1 - t0)) * (W - ml - mr); }
    function Y(v) { return mt + (1 - (v - lo) / (hi - lo)) * (H - mt - mb); }
    function short(v) { return S.cur + (Math.abs(v) >= 1000 ? (v / 1000).toLocaleString("en-GB", { maximumFractionDigits: 1 }) + "k" : Math.round(v)); }
    var grid = "";
    for (var i = 0; i <= 4; i++) { var v = lo + (hi - lo) * i / 4, y = Y(v); grid += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y + '" y2="' + y + '" class="gl"/><text x="' + (ml - 8) + '" y="' + (y + 4) + '" text-anchor="end" class="ax">' + short(v) + "</text>"; }
    function path(key) { return pts.map(function (p, i) { return (i ? "L" : "M") + X(p.date).toFixed(1) + " " + Y(p[key]).toFixed(1); }).join(" "); }
    function fd(d) { return new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
    var last = pts[pts.length - 1];
    var svg = '<svg id="pfchart" viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="Holdings value and amount paid in over time" style="display:block;max-width:100%">' + grid +
      '<text x="' + ml + '" y="' + (H - 8) + '" class="ax">' + fd(pts[0].date) + '</text><text x="' + (W - mr) + '" y="' + (H - 8) + '" text-anchor="end" class="ax">' + fd(last.date) + "</text>" +
      '<path d="' + path("cost") + '" fill="none" stroke="var(--quality)" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>' +
      '<path d="' + path("value") + '" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>' +
      pts.map(function (p) { return '<circle cx="' + X(p.date).toFixed(1) + '" cy="' + Y(p.value).toFixed(1) + '" r="4" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>'; }).join("") +
      '<text x="' + (W - mr + 8) + '" y="' + (Y(last.value) + 4) + '" class="lb" style="font-weight:700">Value</text><text x="' + (W - mr + 8) + '" y="' + (Y(last.cost) + (Math.abs(Y(last.cost) - Y(last.value)) < 14 ? 16 : 4)) + '" class="lb">Paid in</text>' +
      '<line id="pfx" x1="0" x2="0" y1="' + mt + '" y2="' + (H - mb) + '" stroke="var(--muted)" stroke-width="1" visibility="hidden"/></svg>';
    var rowsT = pts.slice().reverse().map(function (p) { return "<tr><td>" + esc(p.date) + '</td><td class="r">' + money(p.value) + '</td><td class="r">' + money(p.cost) + '</td><td class="r">' + signed(p.value - p.cost) + '</td><td class="r">' + money(p.dry) + "</td></tr>"; }).join("");
    return head + '<div style="position:relative;margin-top:8px">' + svg + '<div id="pftip" class="tip" hidden></div></div>' +
      '<p class="small muted"><span class="sw" style="background:var(--ink)"></span>Holdings value &nbsp; <span style="display:inline-block;width:18px;border-top:2px dashed var(--quality);vertical-align:middle;margin-right:6px"></span>Amount paid in (cost basis)</p>' +
      '<details style="margin-top:8px"><summary class="small" style="cursor:pointer">Show as table</summary><div class="tablewrap"><table><thead><tr><th>Date</th><th class="r">Value</th><th class="r">Paid in</th><th class="r">Return</th><th class="r">Dry powder</th></tr></thead><tbody>' + rowsT + "</tbody></table></div></details></section>";
  }
  function wireChart() {
    var svg = document.getElementById("pfchart"); if (!svg) return;
    var pts = S.snaps, tip = document.getElementById("pftip"), line = document.getElementById("pfx");
    svg.addEventListener("mousemove", function (e) {
      var r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 640;
      var t0 = new Date(pts[0].date).getTime(), t1 = new Date(pts[pts.length - 1].date).getTime(), best = 0, bd = 1e9;
      pts.forEach(function (p, i) { var px = 56 + (t1 === t0 ? 0 : (new Date(p.date).getTime() - t0) / (t1 - t0)) * (640 - 56 - 70); if (Math.abs(px - x) < bd) { bd = Math.abs(px - x); best = i; } });
      var p = pts[best], px = 56 + (t1 === t0 ? 0 : (new Date(p.date).getTime() - t0) / (t1 - t0)) * (640 - 56 - 70);
      line.setAttribute("x1", px); line.setAttribute("x2", px); line.setAttribute("visibility", "visible");
      tip.hidden = false; tip.innerHTML = "<b>" + esc(p.date) + "</b><br>Value " + money(p.value) + "<br>Paid in " + money(p.cost) + "<br>Return " + signed(p.value - p.cost);
      tip.style.left = Math.min(px / 640 * r.width, r.width - 150) + "px"; tip.style.top = "0px";
    });
    svg.addEventListener("mouseleave", function () { tip.hidden = true; line.setAttribute("visibility", "hidden"); });
  }

      '<section class="panel"><h2 style="margin-bottom:12px">Layers against target</h2>' + layerRows + '<p class="muted small">The dark tick marks the target. Weights use invested holdings only, not dry powder.</p>' +
      (T.all > 0 && T.byLayer.spec / T.all * 100 > S.specCap ? '<div class="note warn" style="margin-top:8px">Speculative sleeve is ' + pct(T.byLayer.spec / T.all * 100) + ", above the " + S.specCap + "% cap.</div>" : "") + "</section>" +
      '<section class="panel"><h2 style="margin-bottom:8px">Holdings</h2><div class="tablewrap"><table><thead><tr><th>Holding</th><th>Layer</th><th class="r">Shares</th><th class="r">Value</th><th class="r">Weight</th><th class="r">Gain on cost</th><th>Speed now</th></tr></thead><tbody>' + (hr || '<tr><td colspan="7" class="muted">No holdings yet.</td></tr>') + "</tbody></table></div></section></div>";
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.tab) { tab = b.dataset.tab; render(); return; }
    if (b.dataset.add) { var nh = { id: uid(), layer: b.dataset.add, name: "", ticker: "", w: 1, shares: 0, cost: null, price: null, high: null, p30: null, rung: 0 }; S.holdings.push(nh); S.example = false; save(); openSheet(nh.id); return; }
    if (b.dataset.del) { S.holdings = S.holdings.filter(function (h) { return h.id !== b.dataset.del; }); save(); closeSheet(); return; }
    if (b.dataset.trim) { recordTrim(b.dataset.trim); renderPlanOut(); return; }
    var a = b.dataset.act;
    if (a === "record") {
      if (!confirmRecord) { confirmRecord = true; renderPlanOut(); return; }
      recordMonth(); S.example = false; confirmRecord = false; render(); return;
    }
    if (a === "closesheet") { closeSheet(); return; }
    if (a === "howto") { showSheet(howtoHtml()); return; }
    if (a === "snap") { snap(); save(); render(); return; }
    if (a === "refresh") { doRefresh(); return; }
    if (a === "applypaste") {
      var box = document.getElementById("paste"), pm = document.getElementById("pasteMsg"), upd = 0, unknown = [];
      box.value.split("\n").forEach(function (line) {
        var tk = line.trim().split(/[\s;|\t]+/).filter(Boolean);
        if (tk.length < 2) return;
        var key = tk[0].toUpperCase();
        var h = S.holdings.filter(function (x) { return (x.ticker || "").toUpperCase() === key; })[0];
        if (!h) { unknown.push(tk[0]); return; }
        var v = tk.slice(1).map(function (x) { return parseFloat(x.replace(/[^0-9.\-]/g, "")); });
        if (isFinite(v[0])) h.price = v[0];
        if (v.length > 1 && isFinite(v[1])) h.high = v[1];
        if (v.length > 2 && isFinite(v[2])) h.p30 = v[2];
        upd++;
      });
      if (upd) { S.pricesAsOf = new Date().toISOString(); S.example = false; refreshedAt = new Date(); save(); pasteMsgText = "Updated " + upd + (upd > 1 ? " holdings" : " holding") + (unknown.length ? ". Not found: " + unknown.join(", ") : "") + "."; renderPlanOut(); }
      else pm.textContent = unknown.length ? "No match for: " + unknown.join(", ") + ". Tickers must match your Holdings tab." : "Nothing to apply.";
      return;
    }
    if (a === "cancelrec") { confirmRecord = false; renderPlanOut(); return; }
    if (a === "startfresh") { S = blank(); save(); tab = "holdings"; render(); return; }
    if (a === "loadex") { S = example(); save(); tab = "plan"; render(); return; }
    if (a === "copy") {
      var ta = document.getElementById("backup"); ta.select();
      var msg = document.getElementById("backupMsg");
      try { navigator.clipboard.writeText(ta.value).then(function () { msg.textContent = "Copied."; }, function () { msg.textContent = "Press Ctrl/Cmd+C to copy the selected text."; }); }
      catch (err) { msg.textContent = "Press Ctrl/Cmd+C to copy the selected text."; }
      return;
    }
    if (a === "import") {
      var m = document.getElementById("backupMsg");
      try {
        var d = JSON.parse(document.getElementById("backup").value);
        if (!d || !Array.isArray(d.holdings) || !d.alloc) throw new Error("bad");
        S = d; save(); render();
      } catch (err) { m.textContent = "That text is not a valid backup."; }
    }
  });

  document.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-unmanual]");
    if (!a) return;
    e.preventDefault();
    var h = S.holdings.filter(function (x) { return x.id === a.dataset.unmanual; })[0];
    if (h) { h.priceManual = false; save(); renderPlanOut(); }
  });

  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "finnhubKey") { setKey(t.value.trim()); var km = document.getElementById("keyMsg"); if (km) km.textContent = t.value.trim() ? "Key saved in this browser." : "Key removed."; return; }
    if (t.dataset.f) {
      var h = S.holdings.filter(function (x) { return x.id === t.dataset.id; })[0];
      if (!h) return;
      var f = t.dataset.f;
      if (f === "pence") { h.pence = t.value === "pence"; save(); return; }
      if (f === "layer") { h.layer = t.value; save(); return; }
      h[f] = (f === "name" || f === "ticker") ? t.value : (f === "w" ? (num(t.value) || 1) : f === "rung" ? Math.max(0, Math.floor(num(t.value) || 0)) : num(t.value));
      if (f === "shares" && h.shares == null) h.shares = 0;
      if (f === "price" || f === "high" || f === "p30") S.pricesAsOf = new Date().toISOString();
      if (f === "price") h.priceManual = true;
      if (f === "high") h.highManual = true;
      if (f === "p30") h.p30Manual = true;
      S.example = false; save();
      if (tab === "plan") renderPlanOut();
      var sh = document.querySelector(".shead h2"); if (sh && sheetId === h.id) sh.textContent = h.name || h.ticker || "New holding";
      return;
    }
    if (t.id === "investDay") { S.investDay = Math.min(31, Math.max(1, parseInt(t.value, 10) || 1)); save(); renderPlanOut(); return; }
    if (t.id === "monthly") { S.monthly = Math.max(0, num(t.value) || 0); save(); renderPlanOut(); return; }
    if (t.id === "dry") { S.dry = Math.max(0, num(t.value) || 0); save(); renderPlanOut(); return; }
    if (t.dataset.alloc) { S.alloc[t.dataset.alloc] = Math.max(0, num(t.value) || 0); save(); renderPlanOut(); return; }
    if (t.id === "cur") { S.cur = t.value || "£"; save(); return; }
    if (t.id === "specCap") { S.specCap = Math.min(100, Math.max(0, num(t.value) || 0)); save(); return; }
    if (t.id === "halfPct") { S.halfPct = Math.max(0, num(t.value) || 0); save(); return; }
    if (t.dataset.trig) { S.trig[t.dataset.trig] = Math.max(0, num(t.value) || 0); save(); return; }
  });

  // Plan inputs also respond while typing so results stay current
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (tab !== "plan") return;
    if (t.id === "monthly") { S.monthly = Math.max(0, num(t.value) || 0); save(); renderPlanOut(); }
    else if (t.id === "dry") { S.dry = Math.max(0, num(t.value) || 0); save(); renderPlanOut(); }
    else if (t.id === "investDay") { var dv = parseInt(t.value, 10); if (dv >= 1 && dv <= 31) { S.investDay = dv; save(); renderPlanOut(); } }
    else if (t.dataset.alloc) { S.alloc[t.dataset.alloc] = Math.max(0, num(t.value) || 0); save(); renderPlanOut(); }
  });

  document.addEventListener("click", function (e) {
    var row = e.target.closest("[data-open]");
    if (row && !e.target.closest("input,select,a,button,label")) openSheet(row.dataset.open);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !document.getElementById("sheet").hidden) closeSheet();
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-open]")) { e.preventDefault(); openSheet(e.target.dataset.open); }
  });

  render();
  if (storageOK) document.getElementById("saveState").textContent = S.example ? "Example data" : "Saved on this device";
  else document.getElementById("saveState").textContent = "Browser storage unavailable. Use Settings > Backup.";
})();
</script>

</body>
</html>
